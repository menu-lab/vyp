  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden; /* Cero scroll en toda la ventana */
      background-color: #0b1320;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Montserrat', sans-serif;
    }

    /* Contenedor adaptativo: ocupa exactamente la pantalla disponible sin scroll */
    .app-screen {
      height: 100dvh;
      max-height: 100dvh;
      aspect-ratio: 900 / 1700;
      width: auto;
      max-width: 100vw;
      position: relative;
      background-image: url('fondo.jpg');
      background-size: 100% 100%;
      background-repeat: no-repeat;
      background-position: center;
      overflow: hidden;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7);
    }

    .font-cinzel {
      font-family: 'Cinzel', serif;
    }

    /* Zona interactiva central ajustada al mármol */
    .content-canvas {
      position: absolute;
      top: 24.5%;
      bottom: 18.5%;
      left: 6.5%;
      right: 6.5%;
      display: flex;
      flex-direction: column;
      justify-content: space-evenly;
      z-index: 10;
    }

    /* Botones 3D estilo institucional */
    .btn-card {
      position: relative;
      width: 100%;
      background: linear-gradient(135deg, #0d1e38 0%, #061122 100%);
      border: 1.8px solid #c5a059;
      border-radius: 13px;
      padding: 9px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: #ffffff;
      box-shadow: 0 5px 12px rgba(0, 0, 0, 0.18), inset 0 1px 0 rgba(212, 175, 55, 0.4);
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      cursor: pointer;
    }

    .btn-card:active {
      transform: scale(0.975) translateY(2px);
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.25);
    }

    /* Mano interactiva indicadora */
    .pointer-icon {
      position: absolute;
      right: -6px;
      bottom: -8px;
      font-size: 19px;
      color: #eab308;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.6));
      animation: pointPulse 1.3s infinite alternate ease-in-out;
      pointer-events: none;
      z-index: 20;
    }

    @keyframes pointPulse {
      0% { transform: translateY(0) scale(1); }
      100% { transform: translateY(-3px) scale(1.15); }
    }

    /* Botones de canales directos */
    .social-btn {
      flex: 1;
      height: 42px;
      border-radius: 11px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-weight: 700;
      font-size: 11px;
      letter-spacing: 0.4px;
      text-transform: uppercase;
      box-shadow: 0 4px 10px rgba(0,0,0,0.18);
      transition: transform 0.15s ease;
      cursor: pointer;
    }

    .social-btn:active {
      transform: scale(0.96);
    }

    .btn-whatsapp {
      background: linear-gradient(135deg, #1bd741, #128c7e);
      color: #ffffff;
      border: 1px solid #34d399;
    }

    .btn-instagram {
      background: linear-gradient(135deg, #833ab4, #fd1d1d, #fcb045);
      color: #ffffff;
      border: 1px solid #f472b6;
    }

    .btn-email {
      background: linear-gradient(135deg, #1e3a8a, #0f172a);
      color: #f1c40f;
      border: 1px solid #c5a059;
    }
