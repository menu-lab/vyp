<html lang="es">
<head>

  <!-- Tailwind CSS & FontAwesome -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden; /* Cero scroll garantizado */
      background-color: #ffffff; /* Fondo blanco inmutable */
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Montserrat', sans-serif;
    }

    /* Lienzo exacto 900x1700 px a pantalla completa vertical */
    .app-screen {
      height: 100dvh;
      max-height: 100dvh;
      aspect-ratio: 900 / 1700;
      width: auto;
      max-width: 100vw;
      position: relative;
      background-color: #ffffff;
      overflow: hidden;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15);
    }

    /* Capa de fondo con fallback: si existe fondo.jpg lo muestra, si no, usa el degradado y textura */
    .bg-layer {
      position: absolute;
      inset: 0;
      background-image: url('fondo.jpg');
      background-size: 100% 100%;
      background-repeat: no-repeat;
      background-position: center;
      z-index: 1;
    }

    /* Fondo vectorial de respaldo por si fondo.jpg aún no está cargado en el hosting */
    .fallback-header {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 24%;
      background: radial-gradient(ellipse at top, #0f2347 0%, #0a192f 100%);
      border-bottom: 4px solid #d4af37;
      border-bottom-left-radius: 50% 35px;
      border-bottom-right-radius: 50% 35px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: 0 12px 25px rgba(0, 0, 0, 0.35);
      z-index: 2;
    }

    .font-cinzel {
      font-family: 'Cinzel', serif;
    }

    /* Zona interactiva central ajustada */
    .content-canvas {
      position: absolute;
      top: 25%;
      bottom: 18%;
      left: 6.5%;
      right: 6.5%;
      display: flex;
      flex-direction: column;
      justify-content: space-evenly;
      z-index: 10;
    }

    /* Botonera 3D con relieve institucional */
    .btn-card {
      position: relative;
      width: 100%;
      background: linear-gradient(135deg, #0d1e38 0%, #061122 100%);
      border: 1.8px solid #c5a059;
      border-radius: 13px;
      padding: 9px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: #ffffff;
      box-shadow: 0 5px 12px rgba(0, 0, 0, 0.2), inset 0 1px 0 rgba(212, 175, 55, 0.4);
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      cursor: pointer;
    }

    .btn-card:active {
      transform: scale(0.975) translateY(2px);
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.25);
    }

    /* Mano interactiva indicadora */
    .pointer-icon {
      position: absolute;
      right: -6px;
      bottom: -8px;
      font-size: 19px;
      color: #eab308;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.6));
      animation: pointPulse 1.3s infinite alternate ease-in-out;
      pointer-events: none;
      z-index: 20;
    }

    @keyframes pointPulse {
      0% { transform: translateY(0) scale(1); }
      100% { transform: translateY(-3px) scale(1.15); }
    }

    /* Botones de canales directos */
    .social-btn {
      flex: 1;
      height: 42px;
      border-radius: 11px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-weight: 700;
      font-size: 11px;
      letter-spacing: 0.4px;
      text-transform: uppercase;
      box-shadow: 0 4px 10px rgba(0,0,0,0.18);
      transition: transform 0.15s ease;
      cursor: pointer;
    }

    .social-btn:active {
      transform: scale(0.96);
    }

    .btn-whatsapp {
      background: linear-gradient(135deg, #1bd741, #128c7e);
      color: #ffffff;
      border: 1px solid #34d399;
    }

    .btn-instagram {
      background: linear-gradient(135deg, #833ab4, #fd1d1d, #fcb045);
      color: #ffffff;
      border: 1px solid #f472b6;
    }

    .btn-email {
      background: linear-gradient(135deg, #1e3a8a, #0f172a);
      color: #f1c40f;
      border: 1px solid #c5a059;
    }

    /* Footer interactivo para ubicación fija */
    .footer-fixed {
      position: absolute;
      bottom: 2.5%;
      left: 5%;
      right: 5%;
      height: 13.5%;
      background: linear-gradient(135deg, #0d1e38 0%, #061122 100%);
      border: 2px solid #c5a059;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      text-decoration: none;
      color: #ffffff;
      box-shadow: 0 8px 20px rgba(0,0,0,0.3);
      cursor: pointer;
      z-index: 15;
    }

    .footer-fixed:active {
      transform: scale(0.98);
    }

    /* Modales */
    .modal-backdrop {
      display: none;
      position: absolute;
      inset: 0;
      background: rgba(4, 11, 22, 0.78);
      backdrop-filter: blur(5px);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .modal-backdrop.active {
      display: flex;
      animation: fadeIn 0.25s ease-out;
    }

    .modal-sheet {
      background: #ffffff;
      border: 2px solid #c5a059;
      border-radius: 18px;
      width: 100%;
      max-height: 85%;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.96); }
      to { opacity: 1; transform: scale(1); }
    }
  </style>
</head>
